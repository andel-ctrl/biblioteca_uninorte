{% comment %}Filtro por rango de fechas compartido por los reportes (parámetros "desde" y "hasta").{% endcomment %}
<form method="get" class="filtro-fechas" aria-label="Filtrar por periodo">
    <div class="filtro-fechas__campos">
        <label class="campo"><span class="form-label">Desde</span>
            <input type="date" name="desde" value="{{ desde|date:'Y-m-d' }}" class="form-control"></label>
        <label class="campo"><span class="form-label">Hasta</span>
            <input type="date" name="hasta" value="{{ hasta|date:'Y-m-d' }}" class="form-control"></label>
        <button type="submit" class="btn btn-secondary">Aplicar periodo</button>
    </div>
    <p class="filtro-fechas__atajos">
        <span>Atajos:</span>
        {% for etiqueta, a_desde, a_hasta in atajos %}
        <a class="enlace" href="?{% if a_desde %}desde={{ a_desde|date:'Y-m-d' }}&hasta={{ a_hasta|date:'Y-m-d' }}{% endif %}">{{ etiqueta }}</a>{% if not forloop.last %}<span aria-hidden="true">·</span>{% endif %}
        {% endfor %}
    </p>
</form>
