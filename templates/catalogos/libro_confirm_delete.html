{% extends 'base.html' %}
{% block title %}Eliminar Libro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white"><i class="bi bi-trash me-2"></i>Eliminar Libro</div>
            <div class="card-body">
                <p>¿Estás seguro de que deseas eliminar <strong>{{ libro.titulo }}</strong>?</p>
                <p class="text-muted small">Esta acción no se puede deshacer. Se eliminarán también todos sus ejemplares.</p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Sí, eliminar</button>
                    <a href="{% url 'catalogos:libro_detail' libro.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
